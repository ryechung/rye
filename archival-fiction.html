<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>档案小说：《青年梁善进的奇妙冒险》｜麦子 Rye Liang</title>
  <meta
    name="description"
    content="档案小说《青年梁善进的奇妙冒险》，结合冷战航运档案、跨洋轨迹与口述历史考据的跨媒介叙事。全球学术存证 DOI: 10.5281/zenodo.22684643"
  >

  <!-- 引入 Marked.js 用于解析 Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --paper: #f4f1eb;
      --card: #ffffff;
      --ink: #202020;
      --muted: #67645f;
      --line: #cbc4b9;
      --link: #315d88;
      --accent: #8b2b25;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      width: min(880px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 80px;
    }

    .back-nav {
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .header {
      padding: 48px 0 32px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 650;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    /* 章节选择栏 */
    .chapter-nav {
      margin: 32px 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .chapter-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }

    .chapter-btn {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 18px;
      font-size: 14.5px;
      cursor: pointer;
      font-family: inherit;
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    .chapter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .chapter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* 正文阅读卡片 */
    .reader-card {
      background: var(--card);
      border: 1px solid #ddd6cc;
      padding: clamp(24px, 5vw, 48px);
      min-height: 300px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .reader-body {
      font-size: 16.5px;
      line-height: 2;
    }

    .reader-body h1, 
    .reader-body h2, 
    .reader-body h3 {
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      margin-top: 32px;
    }

    .reader-body p {
      margin: 1.4em 0;
      text-align: justify;
    }

    .reader-body blockquote {
      margin: 20px 0;
      padding: 12px 20px;
      border-left: 4px solid var(--accent);
      background: var(--paper);
      color: var(--muted);
    }

    .reader-body hr {
      border: 0;
      border-top: 1px dashed var(--line);
      margin: 36px 0;
    }

    /* 存证信息卡片 */
    .doi-box {
      margin-top: 48px;
      padding: 24px;
      background: var(--paper);
      border-left: 4px solid var(--accent);
      font-size: 14px;
    }

    .doi-box h4 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .doi-box p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="back-nav">
      <a href="index.html">← 返回首页</a>
    </div>

    <header class="header">
      <p class="eyebrow">ARCHIVAL FICTION · 档案小说与历史存证</p>
      <h1>《青年梁善进的奇妙冒险》</h1>
      <p class="subtitle">
        结合冷战航运档案、都市空间变迁与口述历史考据的跨媒介叙事
      </p>
    </header>

    <!-- 篇目选择导航区 -->
    <div class="chapter-nav">
      <span class="chapter-label">篇目索引：</span>
      <div id="btn-group" style="display: inline-flex; gap: 10px; flex-wrap: wrap;"></div>
    </div>

    <!-- 正文渲染阅读区 -->
    <article class="reader-card">
      <div id="novel-content" class="reader-body">
        <p style="color: var(--muted);">正在从学术存证库载入正文...</p>
      </div>
    </article>

    <!-- 学术存证卡片 -->
    <section class="doi-box">
      <h4>🏛️ 学术存证与引用规范</h4>
      <p>
        本作品所有发布版本均已在 Zenodo 欧洲核子研究中心（CERN）服务器永久锁定快照并赋权全球 DOI。
      </p>
      <div>
        <strong>永久解析 DOI：</strong>
        <a href="https://doi.org/10.5281/zenodo.22684643" target="_blank" rel="noopener">10.5281/zenodo.22684643</a>
        ｜
        <a href="https://github.com/ryechung/archival-fiction" target="_blank" rel="noopener">查看 GitHub 源码库</a>
      </div>
    </section>

    <footer>
      麦子（梁忠／Rye Liang）个人实践与档案主页<br>
      页面更新：2026年9月10日
    </footer>
  </main>

  <script>
    // 章节文件清单（以后新增篇目只需在此追加一行）
    const CHAPTERS = [
      {
        id: 1,
        title: "第 001 篇：奥运前的东京街头",
        fileName: "档案小说 001 青年梁善进的奇妙冒险--奥运前的东京街头.md"
      },
      {
        id: 2,
        title: "第 002 篇：巴拿马的太阳",
        fileName: "档案小说 002 青年梁善进的奇妙冒险--巴拿马的太阳.md"
      }
    ];

    const RAW_BASE_URL = "https://raw.githubusercontent.com/ryechung/archival-fiction/main/";

    // 渲染篇目按钮
    function initButtons() {
      const btnGroup = document.getElementById('btn-group');
      btnGroup.innerHTML = '';

      CHAPTERS.forEach((chap, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chapter-btn' + (idx === 0 ? ' active' : '');
        btn.innerText = chap.title;
        btn.onclick = () => loadChapter(chap, btn);
        btnGroup.appendChild(btn);
      });
    }

    // 抓取并渲染对应篇目 Markdown
    function loadChapter(chap, activeBtn) {
      document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');

      const contentBox = document.getElementById('novel-content');
      contentBox.innerHTML = '<p style="color: var(--muted);">正在从学术存证库载入正文...</p>';

      // 自动转义中文与空格，确保 URL 完全合规
      const targetUrl = RAW_BASE_URL + encodeURIComponent(chap.fileName);

      fetch(targetUrl)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP 状态码 ${res.status}`);
          return res.text();
        })
        .then(mdText => {
          contentBox.innerHTML = marked.parse(mdText);
        })
        .catch(err => {
          contentBox.innerHTML = `
            <div style="padding: 16px; border-left: 3px solid var(--accent); background: var(--paper);">
              <p style="color: var(--accent); margin: 0 0 8px; font-weight: 700;">正文读取失败（${err.message}）</p>
              <p style="margin: 0; font-size: 14px; color: var(--muted);">
                可能由于网络波动或 GitHub 原始节点延迟。您可以直接访问 
                <a href="https://github.com/ryechung/archival-fiction" target="_blank" rel="noopener">GitHub 档案库源文件</a> 阅读。
              </p>
            </div>`;
        });
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      initButtons();
      loadChapter(CHAPTERS[0], document.querySelector('.chapter-btn'));
    });
  </script>
</body>
</html>
