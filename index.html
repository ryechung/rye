  <script>
    // 章节文件名定义
    const chapters = {
      1: "档案小说 001 青年梁善进的奇妙冒险--奥运前的东京街头.md",
      2: "档案小说 002 青年梁善进的奇妙冒险--巴拿马的太阳.md"
    };

    let currentOpenChapter = null;

    async function fetchWithFallback(filename) {
      const encodedName = encodeURIComponent(filename);
      // 多线路加速源（优先使用 jsDelivr 全球加速，国内直连极速）
      const sources = [
        `https://cdn.jsdelivr.net/gh/ryechung/archival-fiction@main/${encodedName}`,
        `https://fastly.jsdelivr.net/gh/ryechung/archival-fiction@main/${encodedName}`,
        `https://raw.githubusercontent.com/ryechung/archival-fiction/main/${encodedName}`
      ];

      let lastError = null;
      for (const url of sources) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            return await res.text();
          }
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error("所有线路均无法访问");
    }

    async function loadChapter(chapterNum, btnElement) {
      const reader = document.getElementById('novel-reader');
      const content = document.getElementById('reader-content');
      const buttons = document.querySelectorAll('.chapter-btn');

      // 再次点击同一按钮收起
      if (currentOpenChapter === chapterNum && reader.classList.contains('active')) {
        reader.classList.remove('active');
        btnElement.classList.remove('active');
        currentOpenChapter = null;
        return;
      }

      // 更新按钮高亮
      buttons.forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      currentOpenChapter = chapterNum;

      // 展开阅读区域
      reader.classList.add('active');
      content.innerHTML = '<p style="color: var(--muted);">正在从学术存证库载入正文...</p>';

      // 如果是在本地直接双击打开文件，给出提示
      if (window.location.protocol === 'file:') {
        content.innerHTML = `
          <div style="color: var(--accent); padding: 12px; background: rgba(139,43,37,0.05); border: 1px solid var(--accent);">
            <strong>提示：</strong>本地直接双击打开（<code>file:///</code>）受浏览器安全限制无法跨域拉取文件。<br>
            请通过 VS Code 的 <strong>Live Server</strong> 插件预览，或直接推送到 GitHub Pages 即可正常阅读。
          </div>
        `;
        return;
      }

      try {
        const markdown = await fetchWithFallback(chapters[chapterNum]);
        content.innerHTML = marked.parse(markdown);
      } catch (err) {
        console.error("加载小说失败：", err);
        content.innerHTML = `
          <p style="color: var(--accent);">
            加载超时，请检查网络或点击下方链接直达 GitHub 仓库阅读。
          </p>
        `;
      }
    }
  </script>
