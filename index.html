<!-- 1. 引入轻量级 Markdown 解析器与样式 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">

<!-- 2. 小说正文容器 -->
<div id="novel-content" class="markdown-body" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <p>正在从学术存证库加载最新文本...</p>
</div>

<!-- 3. 动态跨仓库拉取 Markdown 脚本 -->
<script>
  // 替换为小说仓库对应章节的 Raw 链接（注意中文需经过 encodeURIComponent 或直接贴原文件名）
  const chapterUrl = 'https://raw.githubusercontent.com/ryechung/archival-fiction/main/%E6%A1%A3%E6%A1%88%E5%B0%8F%E8%AF%B4%20001%20%E9%9D%92%E5%B9%B4%E6%A2%81%E5%96%84%E8%BF%9B%E7%9A%84%E5%A5%87%E5%A6%99%E5%86%92%E9%99%A9--%E5%A5%A5%E8%BF%90%E5%89%8D%E7%9A%84%E4%B8%9C%E4%BA%AC%E8%A1%97%E5%A4%B4.md';

  fetch(chapterUrl)
    .then(response => {
      if (!response.ok) throw new Error('网络请求失败');
      return response.text();
    })
    .then(markdownText => {
      document.getElementById('novel-content').innerHTML = marked.parse(markdownText);
    })
    .catch(err => {
      document.getElementById('novel-content').innerHTML = '<p>内容加载失败，请直接前往 GitHub 仓库阅读。</p>';
    });
</script>
