<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时空圆柱与空间图谱 (1895—2026)｜麦子 Rye Liang</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root { --bg: #000; --card: rgba(8,8,12,0.94); --line: #38384c; --text: #fff; --muted: #a4a096; --accent: #ff3b30; --gold: #ffd60a; --pin-color: #d4a373; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
    #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .top-overlay { position: absolute; top: 16px; left: 20px; right: 20px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .title-box { background: var(--card); border: 1px solid var(--line); padding: 10px 14px; border-radius: 4px; pointer-events: auto; }
    .title-box h1 { margin: 0 0 3px; font-size: 14px; font-weight: 750; }
    .title-box p { margin: 0; font-size: 10.5px; color: var(--muted); }
    .nav-back { background: var(--card); border: 1px solid var(--line); padding: 6px 12px; border-radius: 4px; font-size: 11.5px; color: #fff; text-decoration: none; pointer-events: auto; }
    .right-dock { position: absolute; top: 72px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 8px; width: 250px; max-height: calc(100vh - 90px); overflow-y: auto; pointer-events: auto; scrollbar-width: none; }
    .dock-panel { background: var(--card); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; }
    .year-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .year-label { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .current-year-display { font-size: 26px; font-weight: 900; font-family: monospace; }
    .btn-play-toggle { width: 100%; background: #14141c; border: 1px solid #4a4a60; color: #fff; padding: 4px; border-radius: 3px; font-size: 10.5px; cursor: pointer; margin-bottom: 6px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; margin: 0; }
    .slider-bounds { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-family: monospace; }
  </style>
</head>
<body>
  <div id="webgl-container"></div>
  <div class="top-overlay">
    <div class="title-box">
      <h1>时空圆柱与空间图谱 (1895—2026)</h1>
      <p>纯净渲染版本</p>
    </div>
    <a href="index.html" class="nav-back">← 返回主页</a>
  </div>
  <div class="right-dock">
    <div class="dock-panel">
      <div class="year-header">
        <span class="year-label">年份</span>
        <span class="current-year-display" id="year-val">1895</span>
      </div>
      <button class="btn-play-toggle" id="btn-play" onclick="togglePlay()">暂停播放 ❚❚</button>
      <input type="range" id="year-slider" min="1895" max="2026" value="1895" step="0.1">
      <div class="slider-bounds"><span>1895</span><span>2026</span></div>
    </div>
  </div>
  <script>
    const CITIES = { "上海": { x: -5.0, z: -2.0 }, "台北": { x: 1.8, z: 5.2 }, "基隆": { x: 2.2, z: 4.2 } };
    const TRAJECTORIES = {
      rye: { name: "Rye / 麦子", colorHex: "#30d158", colorThree: 0x30d158, offset: { x: 0, z: 0 }, labelOffset: { x: 4.5, y: 1.0, z: 0 }, keyframes: [{ year: 1974.0, city: "基隆" }, { year: 2026.0, city: "上海" }] }
    };
    const MIN_YEAR = 1895, MAX_YEAR = 2026, CYLINDER_HEIGHT = 46, BASE_Y = -CYLINDER_HEIGHT / 2;
    function yearToY(year) { return ((year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) - 0.5) * CYLINDER_HEIGHT; }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(55, 42, 70);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("webgl-container").appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));

    const slider = document.getElementById("year-slider");
    const yearDisplay = document.getElementById("year-val");
    let isPlaying = true, playInterval = setInterval(() => {
      let y = parseFloat(slider.value) + 0.1;
      if (y > MAX_YEAR) y = MIN_YEAR;
      yearDisplay.innerText = Math.round(y);
      slider.value = y;
    }, 50);

    function togglePlay() {
      if (isPlaying) { clearInterval(playInterval); isPlaying = false; document.getElementById("btn-play").innerText = "继续播放 ▶"; }
      else { isPlaying = true; document.getElementById("btn-play").innerText = "暂停播放 ❚❚"; }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
