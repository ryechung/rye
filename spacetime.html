<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时空圆柱与地理图谱 (1895—2026)｜麦子 Rye Liang</title>
  <meta name="description" content="1895—2026年家族双系源头、四代主体迁徙、消隐与全球流动的时空拓扑模型。">

  <!-- Three.js 3D 引擎与控制器 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #000000;
      --card: rgba(8, 8, 12, 0.94);
      --line: #38384c;
      --text: #ffffff;
      --muted: #a4a096;
      --accent: #ff3b30;
      --gold: #ffd60a;
      --pin-color: #d4a373;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .top-overlay {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .title-box {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 4px;
      backdrop-filter: blur(14px);
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.85);
    }

    .title-box h1 {
      margin: 0 0 3px;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .title-box p {
      margin: 0;
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.3;
    }

    .nav-back {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11.5px;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      pointer-events: auto;
      backdrop-filter: blur(14px);
      transition: all 0.2s ease;
    }
    .nav-back:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .right-dock {
      position: absolute;
      top: 72px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 250px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      pointer-events: auto;
      scrollbar-width: none;
    }
    .right-dock::-webkit-scrollbar { display: none; }

    .dock-panel {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 10px 12px;
      border-radius: 6px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 32px rgba(0,0,0,0.85);
    }

    /* 大头钉面板始终置顶，年份控制紧随其后。 */
    .dock-echo { order: -1; }

    .year-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .year-label {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .current-year-display {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    .btn-play-toggle {
      width: 100%;
      background: #14141c;
      border: 1px solid #4a4a60;
      color: #ffffff;
      padding: 4px;
      border-radius: 3px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.2s ease;
    }
    .btn-play-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .motion-status {
      min-height: 28px;
      margin: 0 0 7px;
      padding: 5px 7px;
      border-left: 2px solid var(--gold);
      background: rgba(255, 214, 10, 0.06);
      color: #d8d5cc;
      font-size: 9.5px;
      line-height: 1.35;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
    }

    .slider-bounds {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--muted);
      font-family: monospace;
      font-weight: 600;
    }

    .echo-title {
      font-weight: 700;
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      margin-bottom: 0;
    }

    .echo-title:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .echo-chevron {
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .echo-content {
      margin-top: 8px;
    }

    .dock-echo.collapsed .echo-content { display: none; }
    .dock-echo:not(.collapsed) .echo-chevron { transform: rotate(180deg); }

    .echo-input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-label {
      font-size: 10px;
      color: #b0afab;
      display: flex;
      justify-content: space-between;
      margin-bottom: -2px;
    }

    select, input[type="number"], input[type="text"], textarea {
      background: #12121a;
      border: 1px solid #424256;
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 10.5px;
      color: #ffffff;
      font-family: inherit;
      width: 100%;
    }

    textarea {
      resize: vertical;
      min-height: 38px;
      line-height: 1.35;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn-submit-pin {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 6px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-top: 2px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .btn-submit-pin:hover {
      background: #ffe552;
      box-shadow: 0 0 10px rgba(255, 214, 10, 0.4);
    }

    .admin-bar {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #2a2a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
    }
    .admin-toggle {
      background: #1c1c28;
      border: 1px solid #444;
      color: #ccc;
      padding: 2px 6px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 9.5px;
    }
    .admin-toggle.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .pin-list-title {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .pin-item {
      background: #101018;
      border-left: 2px solid var(--pin-color);
      padding: 5px 7px;
      margin-top: 4px;
      border-radius: 2px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .pin-item:hover {
      background: #181824;
      border-left-color: var(--gold);
    }

    .pin-item-head {
      font-weight: 700;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      margin-bottom: 1px;
    }

    .pin-item-body {
      color: #b0afab;
      line-height: 1.3;
      word-break: break-all;
    }

    .btn-delete-pin {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255,59,48,0.8);
      color: #fff;
      border: none;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 2px;
      cursor: pointer;
      display: none;
    }
    .pin-item.admin-mode .btn-delete-pin {
      display: block;
    }

    #pin-tooltip-card {
      position: absolute;
      z-index: 25;
      background: rgba(8, 8, 14, 0.96);
      border: 1px solid var(--pin-color);
      padding: 10px 14px;
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      max-width: 250px;
      line-height: 1.45;
      pointer-events: none;
      display: none;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px rgba(212, 163, 115, 0.3);
    }

    @media (max-width: 768px) {
      .right-dock {
        width: min(300px, calc(100vw - 24px));
        top: 64px;
        bottom: auto;
        right: 12px;
        max-height: calc(100vh - 76px);
      }
      .title-box { max-width: 55vw; }
      .title-box h1 { font-size: 12px; }
      .title-box p { display: none; }
    }
  </style>
</head>

<body>
  <div id="webgl-container"></div>
  <div id="pin-tooltip-card"></div>

  <div class="top-overlay">
    <div class="title-box">
      <h1>时空圆柱与空间图谱 (1895—2026)</h1>
      <p>四代迁徙拓扑 · 标签直显当前城市 · 留下时空大头钉</p>

  <div class="right-dock">
    <div class="dock-panel">
      <div class="year-header">
        <span class="year-label">年份</span>
        <span class="current-year-display" id="year-val">1895</span>

        <span class="echo-chevron" aria-hidden="true">⌄</span>
      </div>
      <div class="echo-content" id="echo-content">
      <div class="echo-input-group">
        <div>
          <div class="input-label"><span>选择地点</span></div>
          <select id="user-city">

            <option value="深圳">深圳</option>
            <option value="杭州">杭州</option>

            <option value="武汉">武汉</option>
            <option value="成都">成都</option>
            <option value="西安">西安</option>
            <option value="厦门">厦门</option>
            <option value="青岛">青岛</option>
            <option value="大连">大连</option>
            <option value="台北">台北</option>
            <option value="基隆">基隆</option>
            <option value="高雄">高雄</option>
            <option value="闽侯福州">闽侯福州</option>
            <option value="香港">香港</option>
            <option value="横滨">横滨</option>
            <option value="神户">神户</option>
            <option value="大阪">大阪</option>
            <option value="釜山">釜山</option>
            <option value="新加坡">新加坡</option>
            <option value="科伦坡">科伦坡</option>
            <option value="苏伊士">苏伊士</option>

  <script>
    // 城市不再凭视觉手工摆放，而由经纬度统一投影。
    // 美洲经度加 360° 展开，使东亚位于中央、太平洋航线保持连续。
    const CITY_GEO = {
      "闽侯福州": { lon: 119.30, lat: 26.08 },
      "上海": { lon: 121.47, lat: 31.23 },
      "北京": { lon: 116.41, lat: 39.90 },
      "天津": { lon: 117.20, lat: 39.08 },
      "重庆": { lon: 106.55, lat: 29.56 },
      "广州": { lon: 113.26, lat: 23.13 },
      "深圳": { lon: 114.06, lat: 22.54 },
      "杭州": { lon: 120.16, lat: 30.27 },
      "南京": { lon: 118.80, lat: 32.06 },
      "武汉": { lon: 114.31, lat: 30.59 },
      "成都": { lon: 104.07, lat: 30.67 },
      "西安": { lon: 108.94, lat: 34.34 },
      "厦门": { lon: 118.09, lat: 24.48 },
      "青岛": { lon: 120.38, lat: 36.07 },

      "台北": { lon: 121.57, lat: 25.04 },

      "香港": { lon: 114.17, lat: 22.32 },
      "横滨": { lon: 139.64, lat: 35.44 },
      "神户": { lon: 135.20, lat: 34.69 },
      "大阪": { lon: 135.50, lat: 34.69 },
      "釜山": { lon: 129.08, lat: 35.18 },
      "新加坡": { lon: 103.82, lat: 1.35 },
      "科伦坡": { lon: 79.86, lat: 6.93 },
      "苏伊士": { lon: 32.55, lat: 29.97 },
      "马赛": { lon: 5.37, lat: 43.30 },
      "鹿特丹": { lon: 4.48, lat: 51.92 },
      "伦敦": { lon: -0.13, lat: 51.51 },
      "旧金山": { lon: -122.42, lat: 37.77 },
      "洛杉矶": { lon: -118.24, lat: 34.05 },
      "巴拿马": { lon: -79.52, lat: 8.98 },
      "纽奥良": { lon: -90.07, lat: 29.95 },
      "纽约": { lon: -74.01, lat: 40.71 },
      "里约热内卢": { lon: -43.17, lat: -22.91 },
      "布宜诺斯艾利斯": { lon: -58.38, lat: -34.60 }
    };

    const MAP_CENTER_LON = 121;
    const MAP_CENTER_LAT = 25;
    const MAP_SCALE_X = 0.18;
    const MAP_SCALE_Z = 0.46;

    function projectGeo(lon, lat) {
      const displayLon = lon < -30 ? lon + 360 : lon;
      return {
        x: (displayLon - MAP_CENTER_LON) * MAP_SCALE_X,
        z: (MAP_CENTER_LAT - lat) * MAP_SCALE_Z
      };
    }

    const CITIES = Object.fromEntries(
      Object.entries(CITY_GEO).map(([name, geo]) => [name, projectGeo(geo.lon, geo.lat)])
    );

    // 这些城市用于访客留言定位，但不常驻显示竖线，避免主画面过密。
    const PIN_ONLY_CITIES = new Set([
      "北京", "天津", "重庆", "广州", "深圳", "杭州", "南京",
      "武汉", "成都", "西安", "厦门", "青岛", "大连"
    ]);

    const seaPoint = (lon, lat) => projectGeo(lon, lat);

    // 海上航路控制点。每条线都绕开主要陆块，并经过真实的海峡/运河。
    const SEA_ROUTES = {
      "基隆→香港": [seaPoint(121.0, 23.0), seaPoint(118.0, 20.0), seaPoint(114.8, 19.0)],
      "香港→新加坡": [seaPoint(113.5, 18.0), seaPoint(112.0, 11.0), seaPoint(108.0, 5.0), seaPoint(104.5, 2.0)],
      "新加坡→科伦坡": [seaPoint(100.0, 4.5), seaPoint(94.0, 6.0), seaPoint(87.0, 6.0), seaPoint(82.0, 6.5)],
      "科伦坡→苏伊士": [seaPoint(70.0, 9.0), seaPoint(58.0, 12.0), seaPoint(47.5, 12.5), seaPoint(42.5, 16.0), seaPoint(38.5, 22.0)],
      "苏伊士→马赛": [seaPoint(30.0, 32.0), seaPoint(23.0, 34.0), seaPoint(15.0, 37.0), seaPoint(8.0, 40.0)],
      "马赛→鹿特丹": [seaPoint(1.0, 39.0), seaPoint(-5.8, 36.0), seaPoint(-9.0, 44.0), seaPoint(-4.0, 49.0), seaPoint(1.5, 51.0)],
      "鹿特丹→伦敦": [seaPoint(3.2, 52.0), seaPoint(1.2, 51.6)],
      "旧金山→横滨": [seaPoint(225.0, 35.0), seaPoint(205.0, 37.0), seaPoint(182.0, 38.0), seaPoint(160.0, 36.0), seaPoint(145.0, 35.0)],
      "洛杉矶→横滨": [seaPoint(238.0, 31.0), seaPoint(215.0, 33.0), seaPoint(185.0, 36.0), seaPoint(158.0, 35.0), seaPoint(145.0, 34.8)],
      "横滨→基隆": [seaPoint(137.0, 33.0), seaPoint(132.0, 30.0), seaPoint(126.0, 27.0), seaPoint(122.5, 25.5)],
      "横滨→神户": [seaPoint(138.0, 33.5), seaPoint(136.0, 33.3)],
      "横滨→釜山": [seaPoint(137.0, 33.4), seaPoint(133.0, 32.8), seaPoint(130.0, 33.8)],
      "神户→大阪": [seaPoint(135.15, 34.45), seaPoint(135.35, 34.40)],
      "大阪→釜山": [seaPoint(133.5, 33.4), seaPoint(131.0, 33.5), seaPoint(129.5, 34.0)],
      "釜山→基隆": [seaPoint(127.0, 32.0), seaPoint(124.0, 28.0), seaPoint(122.0, 26.0)],
      "纽约→纽奥良": [seaPoint(286.0, 38.0), seaPoint(282.0, 31.0), seaPoint(279.0, 25.0), seaPoint(274.0, 24.0), seaPoint(270.0, 27.0)],
      "纽约→伦敦": [{ x: 35, z: -9 }, { x: 42, z: -14 }, { x: 42, z: -20 }, { x: -35, z: -20 }, seaPoint(-12.0, 48.0)],
      "巴拿马→纽约": [seaPoint(284.0, 13.0), seaPoint(279.0, 22.0), seaPoint(282.0, 31.0), seaPoint(285.0, 38.0)],
      "纽奥良→巴拿马": [seaPoint(269.0, 26.0), seaPoint(272.0, 21.0), seaPoint(277.0, 16.0), seaPoint(280.0, 10.0)],
      "巴拿马→洛杉矶": [seaPoint(277.0, 8.0), seaPoint(268.0, 13.0), seaPoint(258.0, 20.0), seaPoint(248.0, 29.0)],

    function buildSailorCareerKeyframes() {
      const frames = [
        { year: 1938, city: "闽侯福州", mode: "land" },
        { year: 1944.9, city: "闽侯福州", mode: "land" },
        { year: 1945.0, city: "上海", mode: "land" },
        { year: 1948.9, city: "上海", mode: "land" },
        { year: 1949.0, city: "基隆", mode: "rest" },
        { year: 1963.0, city: "基隆", mode: "air" }
      ];

      // 16 个两年周期：每条固定航线航行 1.5 年、只往返一次，随后休息半年。
      // 船舶停靠港不包含中国大陆境内港口；基地到登船港使用飞机接驳。
      const routePlans = [
        { name: "横滨—旧金山太平洋线", ports: ["横滨", "旧金山"] },
        { name: "神户—洛杉矶太平洋线", ports: ["神户", "横滨", "洛杉矶"] },
        { name: "釜山—巴拿马太平洋线", ports: ["釜山", "大阪", "神户", "横滨", "旧金山", "洛杉矶", "巴拿马"] },
        { name: "新加坡—鹿特丹苏伊士线", ports: ["新加坡", "科伦坡", "苏伊士", "马赛", "鹿特丹"] },
        { name: "新加坡—伦敦苏伊士线", ports: ["新加坡", "科伦坡", "苏伊士", "马赛", "鹿特丹", "伦敦"] },
        { name: "新加坡—布宜诺斯艾利斯南洋线", ports: ["新加坡", "科伦坡", "里约热内卢", "布宜诺斯艾利斯"] },
        { name: "横滨—纽约巴拿马线", ports: ["横滨", "旧金山", "洛杉矶", "巴拿马", "纽奥良", "纽约"] },
        { name: "大阪—里约跨洋线", ports: ["大阪", "神户", "横滨", "洛杉矶", "巴拿马", "里约热内卢"] },
        { name: "鹿特丹—纽约北大西洋线", ports: ["鹿特丹", "伦敦", "纽约"] },
        { name: "马赛—纽奥良大西洋线", ports: ["马赛", "鹿特丹", "伦敦", "纽约", "纽奥良"] },
        { name: "里约—纽约美洲东岸线", ports: ["里约热内卢", "巴拿马", "纽奥良", "纽约"] },
        { name: "布宜诺斯艾利斯—洛杉矶线", ports: ["布宜诺斯艾利斯", "里约热内卢", "巴拿马", "洛杉矶"] },
        { name: "新加坡—马赛苏伊士线", ports: ["新加坡", "科伦坡", "苏伊士", "马赛"] },
        { name: "大阪—旧金山北太平洋线", ports: ["大阪", "神户", "横滨", "旧金山"] },
        { name: "釜山—新加坡东亚线", ports: ["釜山", "基隆", "香港", "新加坡"] },
        { name: "横滨—纽奥良巴拿马线", ports: ["横滨", "洛杉矶", "巴拿马", "纽奥良"] }
      ];

      const retirementYear = 1995.0;

      function seaLegDistance(fromCity, toCity) {
        const from = CITIES[fromCity];
        const to = CITIES[toCity];
        const points = getSeaRoute(fromCity, toCity, from, to);
        let distance = 0;
        for (let index = 1; index < points.length; index += 1) {
          distance += Math.hypot(
            points[index].x - points[index - 1].x,
            points[index].z - points[index - 1].z
          );
        }
        return Math.max(distance, 0.01);
      }

      routePlans.forEach((plan, routeIndex) => {
        const cycleStart = 1963 + routeIndex * 2;
        const homeCity = cycleStart >= 1983 ? "台北" : "基隆";
        const embarkCity = plan.ports[0];
        const shipStart = cycleStart + 0.05;
        const shipEnd = cycleStart + 1.45;
        const roundTripPorts = [
          ...plan.ports,
          ...plan.ports.slice(0, -1).reverse()
        ];

        frames.push({ year: cycleStart, city: homeCity, mode: "air", routeName: plan.name });
        frames.push({ year: shipStart, city: embarkCity, mode: "sea", routeName: plan.name });

        // 航程按实际海路长度分配时间，并在各港安排不同的短暂停留。
        const legs = roundTripPorts.slice(1).map((city, index) => ({
          from: roundTripPorts[index],
          to: city,
          distance: seaLegDistance(roundTripPorts[index], city)
        }));
        const totalDistance = legs.reduce((sum, leg) => sum + leg.distance, 0);
        const dwellDurations = legs.map((_, index) => {
          const isFinal = index === legs.length - 1;
          return isFinal ? 0 : 0.012 + ((routeIndex * 2 + index) % 4) * 0.006;
        });
        const totalDwell = dwellDurations.reduce((sum, duration) => sum + duration, 0);
        const movingDuration = (shipEnd - shipStart) - totalDwell;
        let cursorYear = shipStart;

        legs.forEach((leg, index) => {
          cursorYear += movingDuration * (leg.distance / totalDistance);
          const isFinalShipPoint = index === legs.length - 1;
          frames.push({
            year: cursorYear,
            city: leg.to,
            mode: isFinalShipPoint ? "air" : "port",
            routeName: plan.name
          });
          if (!isFinalShipPoint) {
            cursorYear += dwellDurations[index];
            frames.push({
              year: cursorYear,
              city: leg.to,
              mode: "sea",
              routeName: plan.name
            });
          }
        });

        frames.push({ year: cycleStart + 1.5, city: homeCity, mode: "rest", routeName: plan.name });
      });

      frames.push(
        { year: retirementYear, city: "台北", mode: "rest" },
        { year: 2011.9, city: "台北", mode: "land" },
        { year: 2012.0, city: "高雄", mode: "rest" },
        { year: 2015.0, city: "高雄", mode: "rest" }
      );

      return frames
        .sort((a, b) => a.year - b.year)
        .filter((frame, index, all) => index === 0 || frame.year > all[index - 1].year);
    }

    TRAJECTORIES.shanjin.keyframes = buildSailorCareerKeyframes();

    const MIN_YEAR = 1895;
    const MAX_YEAR = 2026;
    const CYLINDER_HEIGHT = 46;
    const BASE_Y = -CYLINDER_HEIGHT / 2;

    function yearToY(year) {
      return ((year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) - 0.5) * CYLINDER_HEIGHT;
    }

    function getCityXZForEntity(cityName, entityKey) {
      const base = CITIES[cityName] || { x: 0, z: 0 };
      const item = TRAJECTORIES[entityKey];
      const sharedCities = ["闽侯福州", "上海", "基隆", "台北", "高雄"];
      if (sharedCities.includes(cityName) && item && item.offset) {
        return { x: base.x + item.offset.x, z: base.z + item.offset.z };
      }
      return { x: base.x, z: base.z };
    }

    function getSeaRoute(fromCity, toCity, p1, p2) {
      const forwardKey = `${fromCity}→${toCity}`;
      const reverseKey = `${toCity}→${fromCity}`;
      let waypoints = SEA_ROUTES[forwardKey];
      if (!waypoints && SEA_ROUTES[reverseKey]) {
        waypoints = SEA_ROUTES[reverseKey].slice().reverse();
      }
      return [p1, ...(waypoints || []), p2];
    }

    function interpolatePolyline(points, t) {
      if (points.length < 2) return points[0];
      const lengths = [];
      let total = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const dx = points[i + 1].x - points[i].x;
        const dz = points[i + 1].z - points[i].z;
        const length = Math.hypot(dx, dz);
        lengths.push(length);
        total += length;
      }
      let target = Math.max(0, Math.min(1, t)) * total;
      for (let i = 0; i < lengths.length; i++) {
        if (target <= lengths[i] || i === lengths.length - 1) {
          const localT = lengths[i] === 0 ? 0 : target / lengths[i];
          return {
            x: points[i].x + (points[i + 1].x - points[i].x) * localT,
            z: points[i].z + (points[i + 1].z - points[i].z) * localT
          };
        }
        target -= lengths[i];
      }
      return points[points.length - 1];
    }

    function getEntityPosAtYear(entityKey, year) {
      const item = TRAJECTORIES[entityKey];
      if (!item) return null;

      // Rye 在独立迁往上海前，跟随梁善进最近一次回台的落脚点；
      // 只跟随台北/基隆，不随船出海，也不跟随后来的高雄迁居。
      if (
        item.followHomeOf &&
        year >= item.followFromYear &&
        year < item.followUntilYear
      ) {
        const followed = TRAJECTORIES[item.followHomeOf];
        const latestHome = followed.keyframes
          .filter(kf => kf.year <= year && item.followHomeCities.includes(kf.city))
          .at(-1);
        if (latestHome) {
          const p = getCityXZForEntity(latestHome.city, entityKey);
          return {
            x: p.x,
            y: yearToY(year),
            z: p.z,
            baseX: p.x,
            baseZ: p.z,
            currentCity: latestHome.city,
            travelMode: "rest",
            routeName: ""
          };
        }
      }

      const kfs = item.keyframes;
      if (year < kfs[0].year) return null;
      if (year > kfs[kfs.length - 1].year) return null;

      // 密集航行节点使用二分查找，避免每个动画帧从头扫描约 1800 个节点。
      let low = 0;
      let high = kfs.length - 2;
      let segmentIndex = -1;
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        if (year < kfs[mid].year) {
          high = mid - 1;
        } else if (year > kfs[mid + 1].year) {
          low = mid + 1;
        } else {
          segmentIndex = mid;
          break;
        }
      }
      if (segmentIndex < 0) return null;

      const fromFrame = kfs[segmentIndex];
      const toFrame = kfs[segmentIndex + 1];
      if (fromFrame.city === toFrame.city) {
        const p = getCityXZForEntity(fromFrame.city, entityKey);
        return {
          x: p.x, y: yearToY(year), z: p.z, baseX: p.x, baseZ: p.z,
          currentCity: fromFrame.city,
          travelMode: fromFrame.mode || "rest",
          routeName: fromFrame.routeName || ""
        };
      }

      const t = (year - fromFrame.year) / (toFrame.year - fromFrame.year);
      const fromCity = fromFrame.city;
      const toCity = toFrame.city;
      const p1 = getCityXZForEntity(fromCity, entityKey);
      const p2 = getCityXZForEntity(toCity, entityKey);
      const segmentMode = fromFrame.mode || (item.travelMode === "sea" ? "sea" : "land");
      const isSeaLeg = segmentMode === "sea";
      const isAirLeg = segmentMode === "air";
      const route = isSeaLeg ? getSeaRoute(fromCity, toCity, p1, p2) : [p1, p2];
      const p = interpolatePolyline(route, t);
      return {
        x: p.x,
        y: yearToY(year),
        z: p.z,
        baseX: p.x,
        baseZ: p.z,
        currentCity: isSeaLeg
          ? `航行中 · ${fromCity}→${toCity}`
          : (isAirLeg ? `飞行接驳 · ${fromCity}→${toCity}` : (t < 0.5 ? fromCity : toCity)),
        travelMode: segmentMode,
        routeName: fromFrame.routeName || ""
      };
    }

    function createNameSprite(displayText, colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 440;
      canvas.height = 96;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "rgba(12, 12, 18, 0.92)";
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 3.5;
      
      ctx.beginPath();
      const r = 18;
      ctx.moveTo(8 + r, 8);
      ctx.lineTo(432 - r, 8);
      ctx.quadraticCurveTo(432, 8, 432, 8 + r);
      ctx.lineTo(432, 88 - r);
      ctx.quadraticCurveTo(432, 88, 432, 92);
      ctx.lineTo(8 + r, 92);
      ctx.quadraticCurveTo(8, 92, 8, 88 - r);
      ctx.lineTo(8, 8 + r);
      ctx.quadraticCurveTo(8, 8, 8 + r, 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = colorHex;
      ctx.beginPath();
      ctx.arc(42, 48, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "bold 30px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(displayText, 70, 49);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(9.0, 2.1, 1);
      return sprite;
    }

    function createCityLabelSprite(cityName) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      ctx.font = "600 25px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
      ctx.fillRect(0, 8, 256, 48);
      ctx.fillStyle = "#b8b7b2";
      ctx.fillText(cityName, 128, 32);
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        opacity: 0.86
      }));
      sprite.scale.set(4.8, 1.2, 1);
      return sprite;
    }

    const container = document.getElementById("webgl-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    // 不启用距离雾化，拉远相机时轨迹和城市仍保持清晰。
    scene.fog = null;

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(55, 42, 70);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 200;
    controls.minDistance = 15;

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(30, 60, 30);
    scene.add(dirLight);

    const planeGeo = new THREE.PlaneGeometry(110, 110, 28, 28);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0x14141e, wireframe: true, transparent: true, opacity: 0.4 });
    const floorGrid = new THREE.Mesh(planeGeo, planeMat);
    floorGrid.rotation.x = -Math.PI / 2;
    floorGrid.position.y = BASE_Y;
    scene.add(floorGrid);

    const portsGroup = new THREE.Group();
    scene.add(portsGroup);

    Object.keys(CITIES).forEach(cityName => {
      if (PIN_ONLY_CITIES.has(cityName)) return;
      const pos = CITIES[cityName];
      
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(pos.x, BASE_Y, pos.z),
        new THREE.Vector3(pos.x, -BASE_Y, pos.z)
      ]);
      const lineMat = new THREE.LineDashedMaterial({ color: 0x333344, dashSize: 1.2, gapSize: 2.0 });
      const cityLine = new THREE.Line(lineGeo, lineMat);
      cityLine.computeLineDistances();
      scene.add(cityLine);

      const dotGeo = new THREE.CircleGeometry(0.35, 16);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0xe64539, side: THREE.DoubleSide });
      const dotMesh = new THREE.Mesh(dotGeo, dotMat);
      dotMesh.rotation.x = -Math.PI / 2;
      dotMesh.position.set(pos.x, BASE_Y + 0.02, pos.z);
      portsGroup.add(dotMesh);

      const cityLabel = createCityLabelSprite(cityName);
      cityLabel.position.set(pos.x, BASE_Y + 0.75, pos.z + 0.7);
      portsGroup.add(cityLabel);
    });

    const ringRadius = 45;
    const ringYears = [1895, 1911, 1938, 1945, 1949, 1950, 1963, 1973, 1974, 1995, 2005, 2012, 2015, 2026];
    ringYears.forEach(yr => {
      const y = yearToY(yr);
      const ringGeo = new THREE.BufferGeometry();
      const pts = [];
      for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.15) {
        pts.push(new THREE.Vector3(Math.cos(a) * ringRadius, y, Math.sin(a) * ringRadius));
      }
      ringGeo.setFromPoints(pts);
      const ringMat = new THREE.LineBasicMaterial({ color: 0x222230, transparent: true, opacity: 0.6 });
      scene.add(new THREE.Line(ringGeo, ringMat));
    });

    const dynamicTrailLines = {};
    const trailSampleYears = {};

    function buildStaticTrailGeometry(entityKey, item) {
      const points = [];
      const colors = [];
      const years = [];
      const startYear = item.keyframes[0].year;
      const endYear = Math.min(item.keyframes[item.keyframes.length - 1].year, item.disappearYear || MAX_YEAR);
      const baseColor = new THREE.Color(item.colorHex);
      const darkColor = new THREE.Color("#101018");

      for (let year = startYear; year <= endYear;) {
        const p = getEntityPosAtYear(entityKey, year);
        if (p) {
          points.push(new THREE.Vector3(p.x, p.y, p.z));
          years.push(year);
          const progress = (year - startYear) / Math.max(1, endYear - startYear);
          const color = p.travelMode === "air"
            ? new THREE.Color("#a8b0bd")
            : darkColor.clone().lerp(baseColor, 0.25 + progress * 0.75);
          colors.push(color.r, color.g, color.b);
        }
        const dense = item.travelMode === "mixed" &&
          year >= item.sailingStartYear && year <= item.sailingEndYear;
        year += dense ? 0.01 : 0.12;
      }

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setDrawRange(0, 0);
      trailSampleYears[entityKey] = years;
      return geometry;
    }

    Object.keys(TRAJECTORIES).forEach(key => {
      const item = TRAJECTORIES[key];
      const trailGeo = buildStaticTrailGeometry(key, item);
      const trailMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        linewidth: 2.8,
        transparent: true,
        opacity: 0.95
      });
      const trailLine = new THREE.Line(trailGeo, trailMat);
      scene.add(trailLine);
      dynamicTrailLines[key] = trailLine;
    });

    const sliceGeo = new THREE.CylinderGeometry(ringRadius + 0.5, ringRadius + 0.5, 0.2, 48);
    const sliceMat = new THREE.MeshBasicMaterial({ color: 0xe64539, transparent: true, opacity: 0.08, side: THREE.DoubleSide });
    const sliceMesh = new THREE.Mesh(sliceGeo, sliceMat);
    scene.add(sliceMesh);

    const particleSpheres = {};
    const nameSprites = {};
    const leaderLines = {};
    const groundShadowRings = {};
    const verticalDropLines = {};

    Object.keys(TRAJECTORIES).forEach(key => {
      const item = TRAJECTORIES[key];

      const sphGeo = new THREE.SphereGeometry(0.38, 16, 16);
      const sphMat = new THREE.MeshBasicMaterial({ color: item.colorThree });
      const sph = new THREE.Mesh(sphGeo, sphMat);
      scene.add(sph);
      particleSpheres[key] = sph;

      const sprite = createNameSprite(item.name + " · 启动", item.colorHex);
      scene.add(sprite);
      nameSprites[key] = sprite;

      const leaderGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const leaderMat = new THREE.LineBasicMaterial({ color: item.colorThree, transparent: true, opacity: 0.7 });
      const leaderLine = new THREE.Line(leaderGeo, leaderMat);
      scene.add(leaderLine);
      leaderLines[key] = leaderLine;

      const ringGeo = new THREE.RingGeometry(0.05, 0.15, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: item.colorThree, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
      const shadowRing = new THREE.Mesh(ringGeo, ringMat);
      shadowRing.rotation.x = -Math.PI / 2;
      shadowRing.position.y = BASE_Y + 0.05;
      scene.add(shadowRing);
      groundShadowRings[key] = shadowRing;

      const dropLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, BASE_Y, 0), new THREE.Vector3(0, 0, 0)]);
      const dropLineMat = new THREE.LineBasicMaterial({ color: item.colorThree, transparent: true, opacity: 0.35 });
      const dropLine = new THREE.Line(dropLineGeo, dropLineMat);
      scene.add(dropLine);
      verticalDropLines[key] = dropLine;
    });

    const DEFAULT_PINS = [{ id: "p1", city: "基隆", year: 1949, author: "老兵后代", msg: "在此扎根，岁月回响。" }];
    const LOCAL_PIN_KEY = "rye_spacetime_pushpins_v30";
    const SUPABASE_URL = "https://qgqrknwgiucycauduuiu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rPv-tvduI8bygxJycIzvQA_tOl-uAZB";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    let userPinsList = [];
    let storageMode = "shared";
    const pinObjectsGroup = new THREE.Group();
    scene.add(pinObjectsGroup);

    function toggleEchoPanel(forceOpen) {
      const panel = document.getElementById("echo-panel");
      const title = panel.querySelector(".echo-title");
      const shouldOpen = typeof forceOpen === "boolean" ? forceOpen : panel.classList.contains("collapsed");
      panel.classList.toggle("collapsed", !shouldOpen);
      title.setAttribute("aria-expanded", String(shouldOpen));
    }

    function handleEchoPanelKey(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleEchoPanel();
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    async function loadPushPins() {
      try {
        const { data, error } = await supabaseClient
          .from("pushpins")
          .select("id,city,year,author,message,created_at")
          .order("created_at", { ascending: true })
          .limit(200);
        if (error) throw error;
        userPinsList = (data || []).map(pin => ({ ...pin, msg: pin.message }));
        storageMode = "shared";
      } catch (error) {
        storageMode = "local";
        userPinsList = JSON.parse(localStorage.getItem(LOCAL_PIN_KEY) || "null") || DEFAULT_PINS;
      }
      document.getElementById("storage-status").innerText = storageMode === "shared" ? "公开共享" : "本机备用";
      renderAllPushPins();
    }

    let isAdminMode = false;
    function toggleAdminMode() {
      alert("请在 Supabase 的 Table Editor 中管理留言。网页端不保存管理员密钥。");
    }

    function createPushPinMesh(pinData) {
      const group = new THREE.Group();
      const cityPos = CITIES[pinData.city] || { x: 0, z: 0 };
      const y = yearToY(pinData.year);
      const pinLocalGroup = new THREE.Group();

      const pinMat = new THREE.MeshStandardMaterial({
        color: 0xd4a373,
        emissive: 0x5a3d1e,
        emissiveIntensity: 0.4,
        roughness: 0.3
      });

      const capGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.09, 16);
      const capMesh = new THREE.Mesh(capGeo, pinMat);
      capMesh.position.set(0, 0.28, 0);
      pinLocalGroup.add(capMesh);

      const needleGeo = new THREE.ConeGeometry(0.035, 0.3, 8);
      const needleMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
      const needleMesh = new THREE.Mesh(needleGeo, needleMat);
      needleMesh.rotation.x = Math.PI;
      needleMesh.position.set(0, -0.12, 0);
      pinLocalGroup.add(needleMesh);

      pinLocalGroup.position.set(cityPos.x, y, cityPos.z);
      pinLocalGroup.userData = pinData;
      capMesh.userData = pinData;

      group.add(pinLocalGroup);
      return group;
    }

    function renderAllPushPins() {
      while(pinObjectsGroup.children.length > 0) {
        pinObjectsGroup.remove(pinObjectsGroup.children[0]);
      }
      userPinsList.forEach(pin => {
        pinObjectsGroup.add(createPushPinMesh(pin));
      });

      const container = document.getElementById("pin-items-container");
      document.getElementById("pin-count").innerText = userPinsList.length;
      container.innerHTML = "";

      userPinsList.slice().reverse().forEach(pin => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "pin-item" + (isAdminMode ? " admin-mode" : "");
        itemDiv.onclick = (e) => {
          if (!e.target.classList.contains('btn-delete-pin')) focusOnPushPin(pin);
        };
        itemDiv.innerHTML = `
          <button class="btn-delete-pin" onclick="deletePin('${pin.id}')">删</button>
          <div class="pin-item-head"><span>📍 ${escapeHTML(pin.city)} · ${Number(pin.year)}年</span><span style="color:#a4a096;font-size:9.5px;">${escapeHTML(pin.author)}</span></div>
          <div class="pin-item-body">${escapeHTML(pin.msg)}</div>
        `;
        container.appendChild(itemDiv);
      });
    }

    async function deletePin(id) {
      alert("为保护数据库安全，请在 Supabase 的 Table Editor 中删除或隐藏留言。");
    }

    function focusOnPushPin(pin) {
      updateSpacetime(parseFloat(pin.year));
      const c = CITIES[pin.city] || { x: 0, z: 0 };
      controls.target.set(c.x, yearToY(pin.year), c.z);
    }

    async function submitPushPin() {
      const city = document.getElementById("user-city").value;
      const year = parseFloat(document.getElementById("user-year").value);
      const author = document.getElementById("user-author").value.trim() || "时空访客";
      const msg = document.getElementById("user-msg").value.trim();

      if (!msg) { alert("请写下一句留言。"); return; }
      if (year > 2026 || year < 1895) { alert("年份须在 1895 至 2026 之间。"); return; }

      if (storageMode === "local") {
        userPinsList.push({ id: "pin_" + Date.now(), city, year, author, msg });
        localStorage.setItem(LOCAL_PIN_KEY, JSON.stringify(userPinsList));
      } else {
        let clientHash = localStorage.getItem("rye_spacetime_client_id");
        if (!clientHash) {
          clientHash = crypto.randomUUID ? crypto.randomUUID() : `visitor-${Date.now()}-${Math.random()}`;
          localStorage.setItem("rye_spacetime_client_id", clientHash);
        }
        const { data, error } = await supabaseClient.rpc("submit_pushpin", {
          p_city: city,
          p_year: year,
          p_author: author,
          p_message: msg,
          p_client_hash: clientHash
        });
        if (error) {
          const message = /too many/i.test(error.message)
            ? "提交过于频繁，请一分钟后再试。"
            : "提交失败，请确认 Supabase 数据表和权限已经建立。";
          alert(message);
          return;
        }
        const pin = Array.isArray(data) ? data[0] : data;
        userPinsList.push({ ...pin, msg: pin.message });
      }
      document.getElementById("user-msg").value = "";
      renderAllPushPins();
      toggleEchoPanel(false);
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const pinTooltip = document.getElementById("pin-tooltip-card");

    window.addEventListener("pointerdown", (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(pinObjectsGroup.children, true);

      if (intersects.length > 0) {
        let hit = null;
        intersects.forEach(i => {
          let curr = i.object;
          while(curr) {
            if (curr.userData && curr.userData.city) { hit = curr.userData; break; }
            curr = curr.parent;
          }
        });
        if (hit) {
          pinTooltip.style.display = "block";
          pinTooltip.style.left = Math.min(window.innerWidth - 270, event.clientX + 14) + "px";
          pinTooltip.style.top = Math.max(20, event.clientY - 30) + "px";
          pinTooltip.innerHTML = `
            <div style="font-weight:750;color:var(--gold);margin-bottom:3px;display:flex;justify-content:space-between;"><span>📌 读者时空留名</span><span style="font-size:10px;">${hit.year}年</span></div>
            <div><strong>地点：</strong>${escapeHTML(hit.city)}</div>
            <div><strong>留名人：</strong>${escapeHTML(hit.author)}</div>
            <div style="margin:4px 0;padding:4px 0;border-top:1px dashed #333;color:#f0f0f0;">“${escapeHTML(hit.msg)}”</div>
          `;
          focusOnPushPin(hit);
          setTimeout(() => { pinTooltip.style.display = "none"; }, 6000);
        }
      } else {
        pinTooltip.style.display = "none";
      }
    });

    const slider = document.getElementById("year-slider");
    const yearDisplay = document.getElementById("year-val");
    let isPlaying = true;
    let playInterval = null;

    const lastRenderedText = {};

    function upperBound(sortedValues, value) {
      let low = 0;
      let high = sortedValues.length;
      while (low < high) {
        const mid = Math.floor((low + high) / 2);
        if (sortedValues[mid] <= value) low = mid + 1;
        else high = mid;
      }
      return low;
    }

    function getTravelSegmentAtYear(year) {
      const sailor = TRAJECTORIES.shanjin;
      const kfs = sailor.keyframes;
      for (let i = 0; i < kfs.length - 1; i++) {
        const from = kfs[i];
        const to = kfs[i + 1];
        if (year >= from.year && year <= to.year) {
          return {
            from: from.city,
            to: to.city,
            mode: from.mode || "land",
            routeName: from.routeName || ""
          };
        }
      }
      return null;
    }

    function updateSpacetime(year) {
      const travelSegment = getTravelSegmentAtYear(year);
      const isActiveTravel = travelSegment && ["sea", "air"].includes(travelSegment.mode);
      yearDisplay.innerText = isActiveTravel ? year.toFixed(2) : Math.round(year);
      slider.value = year;
      sliceMesh.position.y = yearToY(year);

      const motionStatus = document.getElementById("motion-status");
      if (travelSegment?.mode === "sea") {
        motionStatus.innerText = `${travelSegment.routeName}｜航行：${travelSegment.from} → ${travelSegment.to}`;
      } else if (travelSegment?.mode === "air") {
        motionStatus.innerText = `${travelSegment.routeName}｜飞机接驳：${travelSegment.from} → ${travelSegment.to}`;
      } else if (travelSegment?.mode === "port") {
        motionStatus.innerText = `${travelSegment.routeName}｜港口停留：${travelSegment.from}`;
      } else if (year >= 1995) {
        motionStatus.innerText = "梁善进：1995 年退休后的居住轨迹";
      } else if (year >= 1963) {
        motionStatus.innerText = "梁善进：回台停留 / 休假（约半年）";
      } else {
        motionStatus.innerText = "家庭迁徙时间轴";
      }

      Object.keys(TRAJECTORIES).forEach(key => {
        const item = TRAJECTORIES[key];
        const pos = getEntityPosAtYear(key, year);
        const sph = particleSpheres[key];
        let sprite = nameSprites[key];
        const leader = leaderLines[key];
        const shadow = groundShadowRings[key];
        const dropLine = verticalDropLines[key];
        const trailLine = dynamicTrailLines[key];

        const startYear = item.keyframes[0].year;
        const visibleTrailPoints = upperBound(trailSampleYears[key], year);
        trailLine.geometry.setDrawRange(0, visibleTrailPoints);
        trailLine.visible = visibleTrailPoints >= 2;

        let isVisible = false;
        let pulseFactor = 1.0;
        let isFlashing = false;

        if (year >= startYear) {
          if (!item.disappearYear || year < item.disappearYear) {
            isVisible = true;
            isFlashing = false;
            pulseFactor = 1.0;
          } else if (item.disappearYear) {
            const delta = year - item.disappearYear;
            const flashDuration = 2.5;
            if (delta <= flashDuration) {
              isVisible = true;
              isFlashing = true;
              const wave = Math.abs(Math.sin(delta * 10.0));
              const fade = 1.0 - (delta / flashDuration);
              pulseFactor = 0.2 + wave * 0.8 * fade;
            } else {
              isVisible = false;
            }
          }
        }

        if (isVisible && pos) {
          sph.visible = true;
          sprite.visible = true;
          leader.visible = true;
          shadow.visible = true;
          dropLine.visible = true;

          const cityName = pos.currentCity || "途中";
          const currentText = `${item.name} · ${cityName}`;
          if (lastRenderedText[key] !== currentText) {
            lastRenderedText[key] = currentText;
            scene.remove(sprite);
            sprite.material.map.dispose();
            sprite.material.dispose();
            const newSprite = createNameSprite(currentText, item.colorHex);
            scene.add(newSprite);
            nameSprites[key] = newSprite;
            sprite = newSprite;
          }

          if (isFlashing) {
            sph.scale.setScalar(1.0 + pulseFactor * 2.8);
            sph.material.opacity = pulseFactor;
            sprite.scale.set(8.5 * (1.0 + pulseFactor * 0.4), 2.1 * (1.0 + pulseFactor * 0.4), 1);
            sprite.material.opacity = pulseFactor;
            leader.material.opacity = pulseFactor * 0.8;
            shadow.material.opacity = pulseFactor * 0.9;
          } else {
            sph.scale.setScalar(1.0);
            sph.material.opacity = 1.0;
            sprite.scale.set(8.5, 2.1, 1);
            sprite.material.opacity = 1.0;
            leader.material.opacity = 0.7;
            shadow.material.opacity = 0.85;
          }

          sph.position.set(pos.x, pos.y, pos.z);

          const targetSpritePos = new THREE.Vector3(
            pos.x + item.labelOffset.x,
            pos.y + item.labelOffset.y,
            pos.z + item.labelOffset.z
          );
          sprite.position.copy(targetSpritePos);

          leader.geometry.setFromPoints([
            new THREE.Vector3(pos.x, pos.y, pos.z),
            targetSpritePos
          ]);

          shadow.position.set(pos.baseX, BASE_Y + 0.05, pos.baseZ);
          dropLine.geometry.setFromPoints([
            new THREE.Vector3(pos.x, BASE_Y, pos.z),
            new THREE.Vector3(pos.x, pos.y, pos.z)
          ]);
        } else {
          sph.visible = false;
          sprite.visible = false;
          leader.visible = false;
          shadow.visible = false;
          dropLine.visible = false;
        }
      });
    }

    slider.addEventListener("input", (e) => {
      updateSpacetime(parseFloat(e.target.value));
    });

    function startLoopPlay() {
      if (playInterval) clearInterval(playInterval);
      playInterval = setInterval(() => {
        const currentYear = parseFloat(slider.value);
        // 使用统一时间步长；不再在航行阶段减速 60 倍。
        let y = currentYear + 0.03;
        if (y > MAX_YEAR) y = MIN_YEAR;
        updateSpacetime(y);
      }, 45);
    }

    function togglePlay() {
      const btn = document.getElementById("btn-play");
      if (isPlaying) {
        clearInterval(playInterval);
        isPlaying = false;
        btn.innerText = "继续播放 ▶";
      } else {
        isPlaying = true;
        btn.innerText = "暂停播放 ❚❚";
        startLoopPlay();
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateSpacetime(1895);
    loadPushPins();
    startLoopPlay();
    animate();
  </script>
